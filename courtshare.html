<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CourtShare London</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');

:root{
  --court-teal:#0B4F4A;
  --court-teal-dark:#083935;
  --line-white:#FFFFFF;
  --cork-cream:#F2E8D5;
  --card-cream:#FBF6EA;
  --ink:#16211F;
  --ink-soft:#4B564F;
  --in-green:#4F9D69;
  --in-green-bg:#E4F1E7;
  --let-amber:#E0A458;
  --let-amber-bg:#FBF0DF;
  --out-clay:#C1502E;
  --out-clay-bg:#F7E4DD;
  --rule:#D9CDAF;
}

*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--cork-cream);
  color:var(--ink);
  min-height:100vh;
}

.app{max-width:760px; margin:0 auto; padding:0 20px 60px;}

/* header */
header{
  background:var(--court-teal);
  color:var(--line-white);
  padding:28px 20px 24px;
  margin:0 -20px 28px;
  position:relative;
  overflow:hidden;
}
header::after{
  content:"";
  position:absolute; left:0; right:0; bottom:14px;
  height:0;
  border-bottom:2px dashed rgba(255,255,255,0.28);
}
.brand{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:26px;
  letter-spacing:-0.02em;
  display:flex; align-items:baseline; gap:8px;
}
.brand .dot{color:var(--let-amber); font-size:20px;}
.tagline{
  font-size:13.5px;
  color:rgba(255,255,255,0.75);
  margin-top:6px;
  max-width:440px;
  line-height:1.5;
}
.who{
  position:absolute; top:26px; right:20px;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:rgba(255,255,255,0.85);
  text-align:right;
}
.who button{
  background:none; border:none; color:var(--let-amber);
  font-family:'JetBrains Mono',monospace; font-size:11.5px;
  cursor:pointer; text-decoration:underline; padding:0; margin-top:2px;
}

/* login gate */
.login-card{
  background:var(--card-cream);
  border:1px solid var(--rule);
  border-radius:14px;
  padding:32px 28px;
  max-width:400px;
  margin:40px auto;
}
.login-card h2{
  font-family:'Space Grotesk',sans-serif;
  font-size:20px; margin-bottom:6px;
}
.login-card p{
  font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:20px;
}
label{
  display:block; font-size:11.5px; font-weight:600; text-transform:uppercase;
  letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:6px; margin-top:14px;
}
label:first-of-type{margin-top:0;}
input, select{
  width:100%; padding:11px 12px; border:1px solid var(--rule); border-radius:8px;
  font-family:'Inter',sans-serif; font-size:14.5px; background:#fff; color:var(--ink);
}
input:focus, select:focus, button:focus-visible{
  outline:2px solid var(--court-teal); outline-offset:1px;
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--court-teal); color:#fff; border:none; border-radius:8px;
  padding:12px 18px; font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
  cursor:pointer; margin-top:20px; width:100%;
  transition:background .15s;
}
.btn:hover{background:var(--court-teal-dark);}
.btn.ghost{
  background:transparent; color:var(--court-teal); border:1.5px solid var(--court-teal);
  width:auto; margin-top:0; padding:9px 14px; font-size:13px;
}
.btn.small{width:auto; padding:9px 16px; font-size:13.5px; margin-top:14px;}
.btn:disabled{opacity:0.45; cursor:not-allowed;}

/* section headings */
.section-label{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--ink-soft); margin:30px 0 12px; display:flex; align-items:center; gap:10px;
}
.section-label::after{content:""; flex:1; border-top:1px dashed var(--rule);}

/* venue grid */
.venue-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.venue-card{
  background:var(--card-cream); border:1px solid var(--rule); border-radius:12px;
  padding:16px; cursor:pointer; text-align:left; transition:border-color .15s, transform .1s;
}
.venue-card:hover{border-color:var(--court-teal); transform:translateY(-1px);}
.venue-card.active{border-color:var(--court-teal); box-shadow:0 0 0 1.5px var(--court-teal) inset;}
.venue-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;}
.venue-area{font-size:12px; color:var(--ink-soft); margin-top:3px;}
.venue-count{
  font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--in-green);
  margin-top:10px; font-weight:600;
}
.venue-count.zero{color:var(--ink-soft);}

/* group cards */
.group-card{
  background:var(--card-cream); border:1px solid var(--rule); border-radius:12px;
  padding:18px; margin-bottom:14px;
}
.group-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.group-when{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px;}
.group-org{font-size:12px; color:var(--ink-soft); margin-top:3px;}
.status-pill{
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
  padding:4px 9px; border-radius:20px; white-space:nowrap;
}
.status-pill.let{background:var(--let-amber-bg); color:#8a5a1f;}
.status-pill.full{background:var(--in-green-bg); color:var(--in-green);}

.shuttle-row{display:flex; gap:5px; margin:14px 0 12px;}
.shuttle{
  width:15px; height:15px; border-radius:50%; border:2px solid var(--court-teal);
}
.shuttle.filled{background:var(--court-teal);}

.members-line{font-size:12.5px; color:var(--ink-soft); margin-bottom:12px;}
.members-line b{color:var(--ink); font-weight:600;}

.whatsapp-reveal{
  background:var(--in-green-bg); border:1px dashed var(--in-green);
  border-radius:10px; padding:14px; margin-top:6px;
}
.whatsapp-reveal .label{
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
  color:var(--in-green); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px;
}
.whatsapp-reveal .number{
  font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:600; color:var(--ink);
}
.whatsapp-reveal a{
  display:inline-block; margin-top:10px; font-size:13px; font-weight:600; color:var(--in-green);
  text-decoration:none; border-bottom:1.5px solid var(--in-green);
}

.group-actions{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}

.empty-state{
  text-align:center; padding:36px 16px; color:var(--ink-soft); font-size:13.5px;
}

/* new group form */
.new-group-card{
  background:var(--court-teal); color:#fff; border-radius:12px; padding:20px;
  margin-bottom:20px;
}
.new-group-card h3{font-family:'Space Grotesk',sans-serif; font-size:16px; margin-bottom:14px;}
.new-group-card label{color:rgba(255,255,255,0.75);}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.hint{font-size:11.5px; color:rgba(255,255,255,0.6); margin-top:6px; line-height:1.4;}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px;
  font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.show{opacity:1;}

.back-link{
  background:none; border:none; color:var(--court-teal); font-size:13px; font-weight:600;
  cursor:pointer; padding:0; margin-bottom:4px;
}

.field-error{font-size:11.5px; color:var(--out-clay); margin-top:6px;}

.btn.danger{
  background:transparent; color:var(--out-clay); border:1.5px solid var(--out-clay);
  width:auto; margin-top:0; padding:9px 14px; font-size:13px;
}
.btn.danger:hover{background:var(--out-clay-bg);}

@media (max-width:480px){
  .venue-grid{grid-template-columns:1fr;}
  .grid-2{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const {useState, useEffect, useCallback} = React;

const VENUES = [
  {id:"v1", name:"Redbridge Sports Centre", area:"Barkingside"},
  {id:"v2", name:"Kensington Leisure Centre", area:"Notting Hill"},
  {id:"v3", name:"Better Streatham Ice & Leisure", area:"Streatham"},
  {id:"v4", name:"Docklands Sports Hub", area:"Canary Wharf"},
  {id:"v5", name:"Finsbury Leisure Centre", area:"Clerkenwell"},
  {id:"v6", name:"Wandsworth Sports Hub", area:"Wandsworth"},
  {id:"v7", name:"Crystal Palace Sports Centre", area:"Crystal Palace"},
  {id:"v8", name:"Walthamstow Feelgood Centre", area:"Walthamstow"},
];

// --- validation & integrity helpers ---
function isValidName(v){
  const t = (v || '').trim();
  return t.length >= 2 && t.length <= 40;
}
function isValidPhone(v){
  const t = (v || '').trim();
  if(!t) return false;
  const digits = t.replace(/[^\d]/g,'');
  return digits.length >= 8 && digits.length <= 15 && /^[\d\s+\-()]+$/.test(t);
}
// Guards against corrupted or tampered entries in shared storage before they
// ever reach the UI — malformed rows are dropped rather than crashing the app.
function isValidGroupShape(g){
  return g && typeof g === 'object'
    && typeof g.id === 'string'
    && typeof g.venueId === 'string'
    && typeof g.organizerName === 'string'
    && typeof g.organizerWhatsapp === 'string'
    && Array.isArray(g.members)
    && typeof g.capacity === 'number' && g.capacity > 0 && g.capacity <= 20;
}
// A slot disappears from listings once its organizer cancels it, or once
// enough distinct people have flagged it — simple community moderation
// since there's no backend to moderate server-side.
function isVisibleGroup(g){
  if(g.cancelled) return false;
  if((g.reports || []).length >= 3) return false;
  return true;
}

function useToast(){
  const [msg, setMsg] = useState(null);
  const show = useCallback((text)=>{
    setMsg(text);
    setTimeout(()=>setMsg(null), 2400);
  },[]);
  return [msg, show];
}

function App(){
  const [loading, setLoading] = useState(true);
  const [profile, setProfile] = useState(null);
  const [groups, setGroups] = useState([]);
  const [activeVenue, setActiveVenue] = useState(null);
  const [showNewGroup, setShowNewGroup] = useState(false);
  const [toastMsg, showToast] = useToast();

  useEffect(()=>{ init(); }, []);

  async function init(){
    try{
      const p = await window.storage.get('profile', false);
      if(p && p.value) setProfile(JSON.parse(p.value));
    }catch(e){ /* no profile yet */ }
    await loadGroups();
    setLoading(false);
  }

  async function fetchLatestGroups(){
    try{
      const g = await window.storage.get('groups', true);
      if(g && g.value){
        const parsed = JSON.parse(g.value);
        if(Array.isArray(parsed)) return parsed.filter(isValidGroupShape);
      }
    }catch(e){ /* storage empty or unreadable — fall through */ }
    return [];
  }

  async function loadGroups(){
    const latest = await fetchLatestGroups();
    setGroups(latest);
  }

  // Every mutation re-fetches the latest shared data first, rather than
  // writing from whatever this tab last had in state — that avoids one
  // person's stale view silently clobbering someone else's edit made in
  // between. `mutator` returns the new array, or null to abort (used for
  // validation failures like rate limits or duplicate posts).
  async function mutateGroups(mutator){
    const latest = await fetchLatestGroups();
    const next = mutator(latest);
    if(next === null) return null;
    setGroups(next);
    try{
      await window.storage.set('groups', JSON.stringify(next), true);
    }catch(e){
      showToast("Couldn't save — try again");
    }
    return next;
  }

  async function handleLogin(name, whatsapp){
    const p = {name: name.trim(), whatsapp: whatsapp.trim()};
    try{
      await window.storage.set('profile', JSON.stringify(p), false);
    }catch(e){ /* continue anyway, keep in memory */ }
    setProfile(p);
  }

  function handleLogout(){
    setProfile(null);
  }

  async function createGroup(venueId, data){
    if(!isValidPhone(data.whatsapp)){
      showToast("That WhatsApp number doesn't look right");
      return;
    }
    const result = await mutateGroups(latest=>{
      // Rate limit: caps how many open slots any one person can flood the
      // board with at once.
      const activeMine = latest.filter(g=>
        g.organizerName === profile.name && isVisibleGroup(g) && g.members.length < g.capacity
      );
      if(activeMine.length >= 3){
        showToast("You already have 3 open slots posted — fill or cancel one first");
        return null;
      }
      // Duplicate-post guard: same person, same venue, same date/time.
      const dupe = latest.find(g=>
        g.venueId === venueId && g.date === data.date && g.time === data.time &&
        g.organizerName === profile.name && isVisibleGroup(g)
      );
      if(dupe){
        showToast("You've already posted a slot for this time");
        return null;
      }
      const newGroup = {
        id: 'g' + Date.now() + Math.random().toString(36).slice(2,7),
        venueId,
        date: data.date,
        time: data.time,
        capacity: parseInt(data.capacity, 10),
        organizerName: profile.name,
        organizerWhatsapp: data.whatsapp.trim(),
        members: [profile.name],
        createdAt: Date.now(),
        cancelled: false,
        reports: [],
      };
      return [...latest, newGroup];
    });
    if(result){
      setShowNewGroup(false);
      showToast("Slot posted — invite people in");
    }
  }

  async function joinGroup(groupId){
    const result = await mutateGroups(latest=>{
      return latest.map(g=>{
        if(g.id !== groupId || !isVisibleGroup(g)) return g;
        const already = g.members.some(m=>m.toLowerCase() === profile.name.toLowerCase());
        if(already) return g;
        if(g.members.length >= g.capacity) return g;
        return {...g, members:[...g.members, profile.name]};
      });
    });
    if(result){
      const g = result.find(x=>x.id===groupId);
      if(g && g.members.length >= g.capacity){
        showToast("That's the group full — WhatsApp number unlocked");
      }else{
        showToast("You're in");
      }
    }
  }

  async function leaveGroup(groupId){
    const result = await mutateGroups(latest=>latest.map(g=>{
      if(g.id !== groupId) return g;
      return {...g, members: g.members.filter(m=>m.toLowerCase() !== profile.name.toLowerCase())};
    }));
    if(result) showToast("Left the slot");
  }

  async function cancelGroup(groupId){
    const result = await mutateGroups(latest=>latest.map(g=>
      g.id === groupId && g.organizerName === profile.name ? {...g, cancelled:true} : g
    ));
    if(result) showToast("Slot cancelled");
  }

  async function reportGroup(groupId){
    const result = await mutateGroups(latest=>latest.map(g=>{
      if(g.id !== groupId) return g;
      const reports = g.reports || [];
      if(reports.some(r=>r.toLowerCase() === profile.name.toLowerCase())) return g;
      return {...g, reports:[...reports, profile.name]};
    }));
    if(result) showToast("Thanks — flagged for review");
  }

  if(loading){
    return <div className="app"><Header profile={null} onLogout={handleLogout} /></div>;
  }

  if(!profile){
    return (
      <div className="app">
        <Header profile={null} onLogout={handleLogout} />
        <LoginForm onSubmit={handleLogin} />
      </div>
    );
  }

  const venueGroups = activeVenue
    ? groups.filter(g=>g.venueId===activeVenue.id && isVisibleGroup(g)).sort((a,b)=>a.createdAt-b.createdAt)
    : [];

  return (
    <div className="app">
      <Header profile={profile} onLogout={handleLogout} />

      {!activeVenue && (
        <React.Fragment>
          <div className="section-label">Pick a venue</div>
          <div className="venue-grid">
            {VENUES.map(v=>{
              const count = groups.filter(g=>g.venueId===v.id && isVisibleGroup(g) && g.members.length < g.capacity).length;
              return (
                <button key={v.id} className="venue-card" onClick={()=>setActiveVenue(v)}>
                  <div className="venue-name">{v.name}</div>
                  <div className="venue-area">{v.area}</div>
                  <div className={"venue-count" + (count===0 ? " zero" : "")}>
                    {count===0 ? "no open slots" : `${count} open slot${count>1?'s':''}`}
                  </div>
                </button>
              );
            })}
          </div>
        </React.Fragment>
      )}

      {activeVenue && (
        <React.Fragment>
          <button className="back-link" onClick={()=>{setActiveVenue(null); setShowNewGroup(false);}}>&larr; All venues</button>
          <div className="section-label">{activeVenue.name}</div>

          {!showNewGroup && (
            <button className="btn ghost" style={{marginBottom:'18px'}} onClick={()=>setShowNewGroup(true)}>
              + Post a slot here
            </button>
          )}

          {showNewGroup && (
            <NewGroupForm
              onCancel={()=>setShowNewGroup(false)}
              onSubmit={(data)=>createGroup(activeVenue.id, data)}
            />
          )}

          {venueGroups.length===0 && !showNewGroup && (
            <div className="empty-state">No slots posted for this venue yet. Be the first — post one above.</div>
          )}

          {venueGroups.map(g=>(
            <GroupCard
              key={g.id}
              group={g}
              profile={profile}
              onJoin={()=>joinGroup(g.id)}
              onLeave={()=>leaveGroup(g.id)}
              onCancel={()=>cancelGroup(g.id)}
              onReport={()=>reportGroup(g.id)}
            />
          ))}
        </React.Fragment>
      )}

      <div className={"toast" + (toastMsg ? " show" : "")}>{toastMsg}</div>
    </div>
  );
}

function Header({profile, onLogout}){
  return (
    <header>
      <div className="brand"><span>CourtShare</span><span className="dot">&#9679;</span><span>London</span></div>
      <div className="tagline">Booked a court with spots going spare? Post it. Looking for a game? Join one. Once a slot fills, everyone gets the group's WhatsApp number.</div>
      {profile && (
        <div className="who">
          {profile.name}
          <br/>
          <button onClick={onLogout}>log out</button>
        </div>
      )}
    </header>
  );
}

function LoginForm({onSubmit}){
  const [name, setName] = useState('');
  const [whatsapp, setWhatsapp] = useState('');
  const [touched, setTouched] = useState(false);

  const nameOk = isValidName(name);
  const phoneOk = isValidPhone(whatsapp);

  function submit(){
    setTouched(true);
    if(nameOk && phoneOk) onSubmit(name, whatsapp);
  }

  return (
    <div className="login-card">
      <h2>Sign in to join</h2>
      <p>Just your name and a WhatsApp number — no password. This is what other players will see when a slot fills.</p>
      <label>Your name</label>
      <input value={name} maxLength={40} onChange={e=>setName(e.target.value)} placeholder="e.g. Priya K" />
      {touched && !nameOk && <div className="field-error">Enter a name (2–40 characters).</div>}
      <label>Your WhatsApp number</label>
      <input value={whatsapp} maxLength={20} onChange={e=>setWhatsapp(e.target.value)} placeholder="e.g. +44 7xxx xxxxxx" />
      {touched && !phoneOk && <div className="field-error">Enter a valid number with country code, e.g. +44 7xxx xxxxxx.</div>}
      <button className="btn" onClick={submit}>Continue</button>
    </div>
  );
}

function NewGroupForm({onCancel, onSubmit}){
  const [date, setDate] = useState('');
  const [time, setTime] = useState('');
  const [capacity, setCapacity] = useState('4');
  const [whatsapp, setWhatsapp] = useState('');
  const [touched, setTouched] = useState(false);

  const today = new Date().toISOString().slice(0,10);
  const phoneOk = isValidPhone(whatsapp);
  const canSubmit = date && time && capacity && phoneOk;

  function submit(){
    setTouched(true);
    if(canSubmit) onSubmit({date, time, capacity, whatsapp});
  }

  return (
    <div className="new-group-card">
      <h3>Post a court slot</h3>
      <div className="grid-2">
        <div>
          <label>Date</label>
          <input type="date" min={today} value={date} onChange={e=>setDate(e.target.value)} />
        </div>
        <div>
          <label>Time</label>
          <input type="time" value={time} onChange={e=>setTime(e.target.value)} />
        </div>
      </div>
      <div className="grid-2">
        <div>
          <label>Players needed (incl. you)</label>
          <select value={capacity} onChange={e=>setCapacity(e.target.value)}>
            <option value="2">2</option>
            <option value="4">4</option>
            <option value="6">6</option>
            <option value="8">8</option>
          </select>
        </div>
        <div>
          <label>Group chat WhatsApp number</label>
          <input value={whatsapp} maxLength={20} onChange={e=>setWhatsapp(e.target.value)} placeholder="+44 7xxx xxxxxx" />
          {touched && !phoneOk && <div className="field-error" style={{color:'#FFD9CB'}}>Needs a valid number with country code.</div>}
        </div>
      </div>
      <div className="hint">This number stays hidden until the slot fills up — then everyone who joined can see it and start the group chat themselves. You can post up to 3 open slots at a time.</div>
      <div className="group-actions">
        <button className="btn small" style={{background:'#fff', color:'var(--court-teal)'}} onClick={submit}>Post slot</button>
        <button className="btn ghost small" style={{borderColor:'rgba(255,255,255,0.6)', color:'#fff'}} onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

function GroupCard({group, profile, onJoin, onLeave, onCancel, onReport}){
  const isMember = group.members.some(m=>m.toLowerCase() === profile.name.toLowerCase());
  const isFull = group.members.length >= group.capacity;
  const isOrganizer = group.organizerName === profile.name;
  const alreadyReported = (group.reports || []).some(r=>r.toLowerCase() === profile.name.toLowerCase());

  const dateLabel = group.date ? new Date(group.date + 'T00:00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}) : '';

  return (
    <div className="group-card">
      <div className="group-top">
        <div>
          <div className="group-when">{dateLabel} &middot; {group.time}</div>
          <div className="group-org">Posted by {group.organizerName}{isOrganizer ? ' (you)' : ''}</div>
        </div>
        <div className={"status-pill " + (isFull ? "full" : "let")}>
          {isFull ? "Full" : `${group.capacity - group.members.length} spot${group.capacity - group.members.length>1?'s':''} left`}
        </div>
      </div>

      <div className="shuttle-row">
        {Array.from({length: group.capacity}).map((_,i)=>(
          <div key={i} className={"shuttle" + (i < group.members.length ? " filled" : "")} />
        ))}
      </div>

      <div className="members-line">
        <b>{group.members.length}/{group.capacity}</b> joined: {group.members.join(', ')}
      </div>

      {isFull && isMember && (
        <div className="whatsapp-reveal">
          <div className="label">Group is full — WhatsApp unlocked</div>
          <div className="number">{group.organizerWhatsapp}</div>
          <a href={"https://wa.me/" + group.organizerWhatsapp.replace(/[^0-9]/g,'')} target="_blank" rel="noopener noreferrer">Message on WhatsApp &rarr;</a>
        </div>
      )}

      {isFull && !isMember && (
        <div className="hint" style={{color:'var(--ink-soft)'}}>This slot is full. Check other slots at this venue.</div>
      )}

      {!isFull && (
        <div className="group-actions">
          {!isMember && <button className="btn small" onClick={onJoin}>Join this slot</button>}
          {isMember && !isOrganizer && <button className="btn ghost small" onClick={onLeave}>Leave</button>}
        </div>
      )}

      <div className="group-actions">
        {isOrganizer && <button className="btn danger" onClick={onCancel}>Cancel this slot</button>}
        {!isOrganizer && !alreadyReported && (
          <button className="btn ghost small" style={{borderColor:'var(--rule)', color:'var(--ink-soft)'}} onClick={onReport}>Report</button>
        )}
        {!isOrganizer && alreadyReported && (
          <span className="hint" style={{color:'var(--ink-soft)'}}>Reported</span>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
